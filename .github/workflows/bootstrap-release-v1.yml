name: Bootstrap v1.0.0 Release

on:
  push:
    branches: [release/bootstrap-v1.0.0]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 already exists; no action needed."
            exit 0
          fi
          test -f Roundtable-v1.0.0-Windows.zip
          gh release create v1.0.0 \
            Roundtable-v1.0.0-Windows.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Roundtable v1.0.0" \
            --notes "Initial packaged Windows release for Roundtable, a multi-model decision-mapping tool. The release asset is migrated from the previously committed source-tree ZIP without modifying its contents."
