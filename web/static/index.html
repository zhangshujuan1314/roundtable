<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roundtable — 多模型圆桌决策</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --fg: #c9d1d9; --fg2: #8b949e;
    --accent: #39d353; --accent2: #58a6ff; --warn: #d29922; --red: #f85149;
    --border: #30363d; --glow: rgba(57,211,83,0.15);
    --font: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font); line-height:1.6; height:100vh; overflow:hidden; }

  /* ── Layout ── */
  .app { display:grid; grid-template-columns:340px 1fr; grid-template-rows:56px 1fr; height:100vh; }
  .header { grid-column:1/-1; background:var(--bg2); border-bottom:1px solid var(--border);
            display:flex; align-items:center; padding:0 24px; gap:16px; }
  .header h1 { font-size:16px; color:var(--accent); font-weight:600; letter-spacing:1px; }
  .header .tag { font-size:11px; color:var(--fg2); background:var(--border); padding:2px 8px; border-radius:4px; }
  .sidebar { background:var(--bg2); border-right:1px solid var(--border); padding:20px; overflow-y:auto; }
  .main { padding:24px; overflow-y:auto; }

  /* ── Input ── */
  .input-group { margin-bottom:20px; }
  .input-group label { display:block; font-size:12px; color:var(--fg2); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; }
  textarea { width:100%; height:100px; background:var(--bg); color:var(--fg); border:1px solid var(--border);
             border-radius:6px; padding:12px; font-family:var(--font); font-size:14px; resize:vertical; }
  textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--glow); }
  textarea::placeholder { color:var(--fg2); }

  .btn { width:100%; padding:12px; background:var(--accent); color:var(--bg); border:none; border-radius:6px;
         font-family:var(--font); font-size:14px; font-weight:600; cursor:pointer; transition:all 0.2s;
         text-transform:uppercase; letter-spacing:1px; }
  .btn:hover { background:#4ae168; box-shadow:0 0 20px var(--glow); }
  .btn:disabled { background:var(--border); color:var(--fg2); cursor:not-allowed; box-shadow:none; }

  .progress { margin-top:16px; display:none; }
  .progress.active { display:block; }
  .progress-step { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; color:var(--fg2); }
  .progress-step.done { color:var(--accent); }
  .progress-step.running { color:var(--accent2); }
  .spinner { width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--accent2);
             border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── Results ── */
  .result { display:none; }
  .result.active { display:block; }
  .result-header { margin-bottom:24px; }
  .result-header h2 { color:var(--accent); font-size:20px; margin-bottom:4px; }
  .result-header .meta { color:var(--fg2); font-size:12px; }

  .section { background:var(--bg2); border:1px solid var(--border); border-radius:8px; margin-bottom:16px;
             overflow:hidden; }
  .section-title { padding:12px 16px; font-size:13px; font-weight:600; text-transform:uppercase;
                   letter-spacing:1px; border-bottom:1px solid var(--border); cursor:pointer;
                   display:flex; justify-content:space-between; align-items:center; }
  .section-title.p1 { color:var(--accent2); }
  .section-title.p2 { color:var(--accent); }
  .section-title.p3 { color:var(--warn); }
  .section-body { padding:16px; font-size:14px; line-height:1.8; }
  .section-body h3 { color:var(--accent2); font-size:14px; margin:12px 0 4px; }
  .section-body ul { margin:4px 0 4px 20px; }
  .section-body blockquote { border-left:3px solid var(--warn); padding:8px 12px; margin:8px 0;
                              background:rgba(210,153,34,0.08); border-radius:0 4px 4px 0; font-size:13px; }
  .section-body .error { color:var(--red); }

  .footer { grid-column:1/-1; background:var(--bg2); border-top:1px solid var(--border);
            padding:8px 24px; font-size:11px; color:var(--fg2); text-align:center; }

  /* ── History ── */
  .history { margin-top:24px; }
  .history h3 { font-size:12px; color:var(--fg2); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .history-item { padding:8px 10px; background:var(--bg); border:1px solid var(--border); border-radius:4px;
                  margin-bottom:6px; font-size:12px; cursor:pointer; transition:border-color 0.2s;
                  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .history-item:hover { border-color:var(--accent); }

  /* ── Markdown render ── */
  .md strong { color:var(--accent2); }
  .md em { color:var(--warn); font-style:normal; }
  .md code { background:var(--bg); padding:1px 5px; border-radius:3px; font-size:13px; }
  .md hr { border:none; border-top:1px solid var(--border); margin:16px 0; }

  @media (max-width:800px) {
    .app { grid-template-columns:1fr; }
    .sidebar { display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>ROUNDTABLE</h1>
    <span class="tag">v1.0</span>
    <span class="tag">多模型圆桌决策</span>
  </div>

  <div class="sidebar">
    <div class="input-group">
      <label>决策问题</label>
      <textarea id="question" placeholder="该不该把感知模块从 A 架构重构成 B?"></textarea>
    </div>
    <button class="btn" id="runBtn" onclick="run()">▶ 开始分析</button>

    <div class="progress" id="progress">
      <div class="progress-step" id="step1"><span class="spinner"></span> 阶段一:独立盲审</div>
      <div class="progress-step" id="step2"><span class="spinner" style="display:none"></span> 阶段二:书记员</div>
      <div class="progress-step" id="step3"><span class="spinner" style="display:none"></span> 阶段三:对抗审查</div>
    </div>

    <div class="history" id="history">
      <h3>历史记录</h3>
    </div>
  </div>

  <div class="main">
    <div class="result" id="result">
      <div class="result-header">
        <h2 id="resultTitle"></h2>
        <div class="meta" id="resultMeta"></div>
      </div>
      <div id="resultBody"></div>
    </div>
    <div id="placeholder" style="text-align:center;color:var(--fg2);margin-top:120px;">
      <div style="font-size:48px;margin-bottom:16px;">◉</div>
      <div style="font-size:14px;">输入决策问题,开始圆桌分析</div>
      <div style="font-size:12px;margin-top:8px;">工具不给答案,只产出决策地图</div>
    </div>
  </div>
</div>

<script>
const API = '';
let historyList = JSON.parse(localStorage.getItem('rt_history') || '[]');
renderHistory();

async function run() {
  const q = document.getElementById('question').value.trim();
  if (!q) return;

  const btn = document.getElementById('runBtn');
  const progress = document.getElementById('progress');
  const result = document.getElementById('result');
  const placeholder = document.getElementById('placeholder');

  btn.disabled = true;
  btn.textContent = '分析中...';
  progress.classList.add('active');
  placeholder.style.display = 'none';
  result.classList.remove('active');

  ['step1','step2','step3'].forEach(id => {
    const el = document.getElementById(id);
    el.className = 'progress-step';
    el.querySelector('.spinner').style.display = 'none';
  });

  try {
    document.getElementById('step1').className = 'progress-step running';
    document.getElementById('step1').querySelector('.spinner').style.display = 'inline-block';

    const resp = await fetch(API + '/api/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error || '请求失败');
    }

    const data = await resp.json();

    ['step1','step2','step3'].forEach(id => {
      document.getElementById(id).className = 'progress-step done';
      document.getElementById(id).querySelector('.spinner').style.display = 'none';
    });

    showResult(q, data);

    historyList.unshift({q: q, ts: new Date().toLocaleString()});
    if (historyList.length > 20) historyList.pop();
    localStorage.setItem('rt_history', JSON.stringify(historyList));
    renderHistory();

  } catch (e) {
    document.getElementById('step1').className = 'progress-step';
    document.getElementById('step1').querySelector('.spinner').style.display = 'none';
    alert('错误: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ 开始分析';
  }
}

function showResult(q, data) {
  const result = document.getElementById('result');
  document.getElementById('resultTitle').textContent = q;
  document.getElementById('resultMeta').textContent =
    `${data.time} · 面板: ${data.panel.join(' / ')}`;

  const body = document.getElementById('resultBody');
  body.innerHTML = '';

  // P1
  const p1 = makeSection('P1: 各模型原始意见', 'p1');
  data.takes.forEach(t => {
    const div = document.createElement('div');
    if (t.error) {
      div.innerHTML = `<h3 class="error">⚠ ${t.model} — ${t.error}</h3>`;
    } else {
      div.innerHTML = `<h3>${t.model}</h3><div class="md">${renderMd(t.text)}</div>`;
    }
    p1.querySelector('.section-body').appendChild(div);
  });
  body.appendChild(p1);

  // P2
  const p2 = makeSection('P2: 决策地图', 'p2');
  p2.querySelector('.section-body').innerHTML = renderMd(data.decision_map);
  body.appendChild(p2);

  // P3
  const p3 = makeSection('P3: 对抗性审查', 'p3');
  p3.querySelector('.section-body').innerHTML = renderMd(data.adversary);
  body.appendChild(p3);

  result.classList.add('active');
}

function makeSection(title, cls) {
  const div = document.createElement('div');
  div.className = 'section';
  div.innerHTML = `<div class="section-title ${cls}">${title}</div><div class="section-body"></div>`;
  div.querySelector('.section-title').onclick = () => {
    const body = div.querySelector('.section-body');
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
  };
  return div;
}

function renderMd(text) {
  if (!text) return '';
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
    .replace(/^---$/gm, '<hr>')
    .replace(/\n/g, '<br>');
}

function renderHistory() {
  const el = document.getElementById('history');
  el.innerHTML = '<h3>历史记录</h3>';
  historyList.forEach((h, i) => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.textContent = h.q;
    div.onclick = () => {
      document.getElementById('question').value = h.q;
    };
    el.appendChild(div);
  });
}

document.getElementById('question').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) run();
});
</script>
</body>
</html>
